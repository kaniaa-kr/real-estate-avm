name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check notebook rules
        run: python scripts/check_notebooks.py

      - name: Run tests
        run: pytest -v

      # Artefak v1 belum ada di main sampai PR Role 4 merge; jalankan bila tersedia
      # agar CI benar-benar menguji meta v1 terhadap api/schemas.py.
      - name: Run artifact tests against model v1 (jika tersedia)
        if: hashFiles('models/model_pipeline_v1.joblib') != ''
        env:
          MODEL_PATH: models/model_pipeline_v1.joblib
          META_PATH: models/model_meta_v1.json
        run: pytest tests/test_artifact.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npx eslint app components lib

      - name: Build
        run: npm run build
